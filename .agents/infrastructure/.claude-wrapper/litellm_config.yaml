# ============================================================================
# LiteLLM Proxy Configuration - Ollama Cloud Bridge
# ============================================================================
# Routes requests from Claude Code / Codex CLI to Ollama Cloud models.
# The proxy listens on port 4000 and translates OpenAI-compatible API calls.
# ============================================================================

model_list:
  # Minimax M2.7 - High reasoning model
  - model_name: minimax-m2.7:cloud
    litellm_params:
      model: ollama_chat/minimax-m2.7:cloud
      api_base: https://ollama.com
      api_key: os.environ/OLLAMA_API_KEY
      request_timeout: 300
      stream_timeout: 300

  # GLM 5.1 - Fast and creative model
  - model_name: glm-5.1:cloud
    litellm_params:
      model: ollama_chat/glm-5.1:cloud
      api_base: https://ollama.com
      api_key: os.environ/OLLAMA_API_KEY
      request_timeout: 300
      stream_timeout: 300

  # Kimi K2.6 - Advanced reasoning model
  - model_name: kimi-k2.6:cloud
    litellm_params:
      model: ollama_chat/kimi-k2.6:cloud
      api_base: https://ollama.com
      api_key: os.environ/OLLAMA_API_KEY
      request_timeout: 300
      stream_timeout: 300

litellm_settings:
  # Drop unsupported parameters instead of erroring
  drop_params: true
  # Global request timeout in seconds (5 minutes)
  request_timeout: 300
  # Automatically retry on timeout or 500 errors
  num_retries: 2
  retry_after: 5
  # Enable verbose logging for debugging (set to false once stable)
  set_verbose: false
  # Disable telemetry to remove the primary latency bottleneck
  telemetry: false
  # Cache DISABLED: LiteLLM's disk cache uses only the user message as the
  # cache key and ignores the system prompt and conversation history. This
  # means different contexts return stale/wrong answers. For coding agents
  # that rely on fresh reasoning every time, caching does more harm than good.
  cache: false
