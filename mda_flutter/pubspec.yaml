name: mda_flutter
description: "The Most Dangerous Writing App — Flutter rewrite. A journaling app where stopping typing destroys your text."
publish_to: 'none'
version: 1.5.8+1

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.0.9
  camera: ^0.12.0+2
  collection: ^1.19.1
  ffmpeg_kit_flutter_new_min_gpl: ^2.6.2
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.0.0
  gal: ^2.3.3
  get_thumbnail_video: ^0.7.3
  go_router: ^17.5.0
  http: ^1.6.0
  intl: ^0.20.3
  local_auth: ^3.0.2
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  sqflite: ^2.4.3
  vibration: ^3.2.0
  video_player: ^2.14.0
  wakelock_plus: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

  fonts:
    - family: MaterialCommunityIcons
      fonts:
        - asset: assets/fonts/MaterialCommunityIcons.ttf
    - family: PlayfairDisplay
      fonts:
        - asset: assets/fonts/PlayfairDisplay_400Regular.ttf
    - family: SpaceMono
      fonts:
        - asset: assets/fonts/SpaceMono_400Regular.ttf
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat_400Regular.ttf
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora_400Regular.ttf
    - family: ZillaSlab
      fonts:
        - asset: assets/fonts/ZillaSlab_400Regular.ttf
    - family: CrimsonPro
      fonts:
        - asset: assets/fonts/CrimsonPro_400Regular.ttf
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans_400Regular.ttf
    - family: EagleLake
      fonts:
        - asset: assets/fonts/EagleLake_400Regular.ttf

  assets:
    - assets/fonts/
