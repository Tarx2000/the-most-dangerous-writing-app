name: mda_flutter
description: "The Most Dangerous Writing App — Flutter rewrite. A journaling app where stopping typing destroys your text."
publish_to: 'none'
version: 1.5.8+1

environment:
  sdk: ^3.12.2

dependencies:
  archive: ^4.0.9
  camera: ^0.12.0+2
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^11.0.0
  gal: ^2.3.3
  go_router: ^17.5.0
  http: ^1.6.0
  intl: ^0.20.3
  local_auth: ^3.0.2
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  sqflite: ^2.4.3
  vibration: ^3.2.0
  video_player: ^2.14.0
  wakelock_plus: ^1.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2

flutter:
  uses-material-design: true

  fonts:
    - family: MaterialCommunityIcons
      fonts:
        - asset: assets/fonts/MaterialCommunityIcons.ttf

  assets:
    - assets/fonts/
